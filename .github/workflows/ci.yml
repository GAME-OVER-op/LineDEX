name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

          echo "SDK root: $sdk_root"
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version

          sdkmanager --sdk_root="$sdk_root" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          echo "Installed Android packages:"
          sdkmanager --sdk_root="$sdk_root" --list_installed

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk_home="$sdk_root/ndk/29.0.14206865"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"

          require_file() {
            local path="$1"
            if [[ ! -f "$path" ]]; then
              echo "::error::Required file is missing: $path"
              find "$sdk_root" -maxdepth 4 -type f 2>/dev/null | sort | head -n 250
              exit 1
            fi
            echo "Found: $path"
          }

          require_exec() {
            local path="$1"
            if [[ ! -x "$path" ]]; then
              echo "::error::Required executable is missing: $path"
              ls -la "$(dirname "$path")" 2>/dev/null || true
              exit 1
            fi
            echo "Found executable: $path"
          }

          require_file "$sdk_root/platforms/android-36/android.jar"
          require_exec "$sdk_root/build-tools/36.0.0/aapt2"
          require_exec "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang"

      - name: Restore optional stable development keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LINEDEX_DEV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LINEDEX_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINEDEX_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LINEDEX_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No stable development key configured; using Gradle debug signing."
            exit 0
          fi

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          install -d -m 700 "$RUNNER_TEMP/linedex-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/linedex-signing/dev.jks"
          chmod 600 "$RUNNER_TEMP/linedex-signing/dev.jks"
          install -d -m 700 "$HOME/.gradle"
          {
            printf 'LINEDEX_DEV_STORE_FILE=%s\n' "$RUNNER_TEMP/linedex-signing/dev.jks"
            printf 'LINEDEX_DEV_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'LINEDEX_DEV_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'LINEDEX_DEV_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Unit tests, lint and dev release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:testDevReleaseUnitTest \
            :app:lintDevRelease \
            :app:assembleDevRelease

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/devRelease/app-devRelease.apk"
          ./scripts/verify-apks.sh "$apk"
          unzip -p "$apk" assets/xposed_init \
            | grep -qx 'com.linedex.desktop.xposed.LineDexXposedEntry'

      - name: Upload dev release
        uses: actions/upload-artifact@v7
        with:
          name: LineDEX-devRelease
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/devRelease/app-devRelease.apk
            app/build/reports/lint-results-devRelease.html
