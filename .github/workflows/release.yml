name: Signed release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LINEDEX_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/linedex-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/linedex-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/linedex-signing/release.jks"

      - name: Build signed release
        env:
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_STORE_FILE: ${{ runner.temp }}/linedex-signing/release.jks
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_STORE_PASSWORD: ${{ secrets.LINEDEX_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_KEY_ALIAS: ${{ secrets.LINEDEX_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_KEY_PASSWORD: ${{ secrets.LINEDEX_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease

      - name: Verify and prepare files
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose "$apk"
          ./scripts/verify-apks.sh "$apk"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            version="manual-${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          cp "$apk" "dist/LineDEX-${version}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineDEX-signed
          if-no-files-found: error
          retention-days: 30
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "LineDEX $GITHUB_REF_NAME" \
            dist/*
