name: Signed release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

          echo "SDK root: $sdk_root"
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version

          sdkmanager --sdk_root="$sdk_root" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          echo "Installed Android packages:"
          sdkmanager --sdk_root="$sdk_root" --list_installed

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk_home="$sdk_root/ndk/29.0.14206865"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"

          require_file() {
            local path="$1"
            if [[ ! -f "$path" ]]; then
              echo "::error::Required file is missing: $path"
              find "$sdk_root" -maxdepth 4 -type f 2>/dev/null | sort | head -n 250
              exit 1
            fi
            echo "Found: $path"
          }

          require_exec() {
            local path="$1"
            if [[ ! -x "$path" ]]; then
              echo "::error::Required executable is missing: $path"
              ls -la "$(dirname "$path")" 2>/dev/null || true
              exit 1
            fi
            echo "Found executable: $path"
          }

          require_file "$sdk_root/platforms/android-36/android.jar"
          require_exec "$sdk_root/build-tools/36.0.0/aapt2"
          require_exec "$sdk_root/build-tools/36.0.0/apksigner"
          ndk_toolchain="$ndk_home/toolchains/llvm/prebuilt/linux-x86_64"
          require_exec "$ndk_toolchain/bin/clang"
          require_file "$ndk_toolchain/sysroot/usr/include/android/api-level.h"

          echo "NDK clang version:"
          "$ndk_toolchain/bin/clang" --version
          echo "Verifying Android arm64 API 35 target support..."
          printf 'int main(void) { return 0; }\n' \
            | "$ndk_toolchain/bin/clang" \
                --target=aarch64-linux-android35 \
                --sysroot="$ndk_toolchain/sysroot" \
                -x c -fsyntax-only -

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LINEDEX_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/linedex-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/linedex-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/linedex-signing/release.jks"

      - name: Build signed release
        env:
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_STORE_FILE: ${{ runner.temp }}/linedex-signing/release.jks
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_STORE_PASSWORD: ${{ secrets.LINEDEX_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_KEY_ALIAS: ${{ secrets.LINEDEX_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LINEDEX_RELEASE_KEY_PASSWORD: ${{ secrets.LINEDEX_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease

      - name: Verify and prepare files
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          apk="app/build/outputs/apk/release/app-release.apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          ./scripts/verify-apks.sh "$apk"

          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            version="manual-${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p dist
          cp "$apk" "dist/LineDEX-${version}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LineDEX-signed
          if-no-files-found: error
          retention-days: 30
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "LineDEX $GITHUB_REF_NAME" \
            dist/*
